name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Grants the action permission to push to your GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push the image if we are on the main branch (not just testing a pull request)
          push: ${{ github.event_name != 'pull_request' }}
          # Tag the image with your GitHub username and repository
          tags: ghcr.io/${{ github.repository_owner }}/langchain-assistant:latest
          # Use GitHub Action caching to make subsequent builds much faster
          cache-from: type=gha
          cache-to: type=gha,mode=max

